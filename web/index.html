<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambito</title>
  <link rel="stylesheet" href="/web/css/estilos.css">
</head>
<body>
  <div id="app">

    <header id="barra">
      <span id="nombre-app">Ambito</span>
      <span id="nombre-archivo">Sin titulo</span>
      <div id="zoom-controles">
        <button id="btn-zoom-menos" title="Alejar">-</button>
        <span id="indicador-zoom">100%</span>
        <button id="btn-zoom-mas" title="Acercar">+</button>
        <button id="btn-ajustar" title="Ajustar a contenido (Ctrl+Shift+H)">Ajustar</button>
      </div>
      <div id="barra-acciones">
        <button id="btn-guardar">Guardar</button>
        <button id="btn-guardar-como">Guardar como</button>
      </div>
    </header>

    <aside id="paleta">
      <!-- construido dinamicamente por paleta.js -->
    </aside>

    <main id="lienzo-contenedor">
      <svg id="lienzo" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="patron-cuadricula" width="10" height="10" patternUnits="userSpaceOnUse">
            <circle cx="0.5" cy="0.5" r="0.5" fill="#E5E7EB"/>
          </pattern>
        </defs>
        <rect id="fondo-cuadricula" width="100%" height="100%" fill="url(#patron-cuadricula)"/>
        <!-- raiz: todos los elementos van dentro para que pan/zoom sea un solo transform -->
        <g id="raiz"></g>
      </svg>
      <input id="etiqueta-editor" type="text" hidden autocomplete="off" spellcheck="false">
    </main>

    <aside id="propiedades">
      <!-- construido dinamicamente por propiedades.js -->
    </aside>

  </div>

  <!-- modal guardar como -->
  <div id="modal-guardar-como" class="modal-fondo" hidden>
    <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo" class="modal-encabezado">Guardar como</h2>
      <label class="modal-etiqueta" for="modal-nombre">Nombre del archivo</label>
      <input id="modal-nombre" type="text" class="modal-input" autocomplete="off" spellcheck="false">
      <p class="modal-hint">Solo letras, numeros, guiones y guion bajo. Sin extension.</p>
      <div class="modal-acciones">
        <button id="modal-cancelar" class="btn-secundario">Cancelar</button>
        <button id="modal-confirmar" class="btn-primario">Guardar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/web/js/app.js"></script>
</body>
</html>
